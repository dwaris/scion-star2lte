# devices/star2lte/device.conf: the Samsung Galaxy S9+ (SM-G965F, Exynos 9810). README.md here has what differs from the S9 and
# where each fact came from.
# What is seen working is on by default (configs/star2lte.config, "The S9+'s defaults"): the boot-arguments
# named below as defaults are on every image devices/star2lte/mkimage.sh makes, and a run's own arguments go over them.

device star2lte
	title       Galaxy S9+
	vendor      Samsung
	soc         exynos9810
	defconfig   star2lte_defconfig
	maintainer  Scion (README.md)
	status      display     partial   the panel at 1440 x 2960: frames scaled by DPP and scanned out with zero copy (fb_dpp=1 fb_zc=1); UEFI framebuffer borrowed from starlte (mkimage.sh -U); brightness slider does not work (s6e3ha8_star2 panel variant lacks driver, stays at bootloader level); seen on the phone, November 2026
	status      cpu         partial   all cores running iOS, four A55s and four M3s (cpus=8 bootcpu=2 m3_prep=3 pan=0 isa_floor=1); clusters scaled with cpufreq_gov=1: seen on the phone
	status      touch       works     Samsung S6SY761 on USI03's HSI2C, multi-touch responsive (s6sy761=1): seen on the phone
	status      buttons     works     power, volume, Bixby as home button (exynos_keys=1): verified working on the phone
	status      storage     works     UFS read through loader (ufs=2) and kernel UFS driver (ufs=3), SYSTEM on ufs_SYSTEM, persistent /private/var in USERDATA (ufs_write=1 var_hfs=ufs_USERDATA_data): seen on the phone
	status      gpu         partial   Mali-G72 MP18 (mali=9 mali_gov=1): seen on the phone, SpringBoard UI rendering accelerated
	status      audio       partial   the speakers: ABOX RDMA + dual MAX98512 amps on I2C (abox=8 max98512=3) with GLOBAL_SHDN wake delay fix; CS47L93 codec (cs47l93=6) and mic (abox_mic=1): stereo audio output and sounds heard working on the phone, November 2026
	status      battery     works     MAX77705 gauge and charger (max77705=1): battery percentage and charging status seen on the phone
	status      wifi        works     BCM4361 on PCIe (wifi_pcie=6 brcmfmac=8 wifi=1): Wi-Fi networks visible in iOS Settings, DHCP and network connectivity working
	status      bluetooth   partial   BCM4361 on UART_BT (bt=7): Bluetooth active in iOS Settings
	status      cellular    missing   Shannon baseband not started
	status      sensors     works     sensor hub in BCM4775 GNSS chip on USI_CHUB00 SPI (shub=6) with shub_rot=270: accelerometer, orientation, portrait and landscape auto-rotation verified working on the phone, November 2026
	status      haptic      works     MAX77705 haptic block and PWM (max77705_haptic=1): haptic feedback felt on the phone
	status      thermal     partial   TMU thermal monitoring (tmu=3): seen on the phone
	status      camera      missing   dual rear camera (S5K2L3 + S5K3M3) and front S5K3H1 not yet verified on S9+
	status      torch       partial   S2MPB02 flash block
	status      usb         works     USB serial log and CDC-ACM console (usb_gadget=5 max77705_usbsw=1): seen on the phone
